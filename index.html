<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b26;touch-action:manipulation}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Customize: ?name=Yakshini&msg=Your message&from=Your name
const Q=new URLSearchParams(location.search);
const NAME=Q.get('name')||'Yakshini';
const MSG=Q.get('msg')||'Wishing you a year full of magic, happiness and beautiful moments';
const FROM=Q.get('from')||'';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,dpr;
function resize(){ dpr=devicePixelRatio||1; W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize',resize); resize();
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// ---------- Audio ----------
let AC; const F={};
function initAudio(){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,at=0,type='sine',g=.12){
  if(!AC) return; const o=AC.createOscillator(),v=AC.createGain(),n=AC.currentTime+at;
  o.type=type; o.frequency.setValueAtTime(f,n); v.gain.setValueAtTime(0,n); v.gain.linearRampToValueAtTime(g,n+.03); v.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(v); v.connect(AC.destination); o.start(n); o.stop(n+d+.05);
}
function chime(a){ a.forEach((f,i)=>tone(f,1.2,i*.14,'sine',.07)); }
function melody(){
  const N=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],
    [392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
  let at=.3; for(const [f,b] of N){ tone(f,b*.55,at,'triangle',.08); at+=b*.5; }
}

// ---------- Helpers ----------
function text(str,x,y,font,color,a=1){ ctx.globalAlpha=a; ctx.fillStyle=color; ctx.font=font; ctx.textAlign='center'; ctx.fillText(str,x,y); ctx.globalAlpha=1; }
function glow(str,x,y,font,color,gc,blur,a){
  ctx.save(); ctx.globalAlpha=a; ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=gc; ctx.shadowBlur=blur; ctx.fillStyle=color; ctx.fillText(str,x,y); ctx.restore();
}
function wrap(s,x,y,maxW,lh,font,color,a){
  ctx.font=font; let line=''; for(const w of s.split(' ')){
    const tst=line?line+' '+w:w;
    if(ctx.measureText(tst).width>maxW&&line){ text(line,x,y,font,color,a); line=w; y+=lh; } else line=tst;
  } text(line,x,y,font,color,a); return y;
}
const stars=Array.from({length:140},()=>({x:rnd(),y:rnd()*.68,p:rnd()*6,s:.5+rnd()}));
const LAN=Array.from({length:9},(_,i)=>({x:.08+rnd()*.84,v:.05+rnd()*.035,ph:rnd()*6,s:.8+rnd()*.5,d:11+i*.9}));

// ---------- Fireflies that form the name ----------
let FF=[], NFS=80;
function build(){
  const o=document.createElement('canvas'); o.width=W; o.height=H; const c=o.getContext('2d');
  let fs=Math.min(W*.24,H*.2); c.font=`${fs}px "Great Vibes",cursive`;
  while(c.measureText(NAME).width>W*.88){ fs*=.93; c.font=`${fs}px "Great Vibes",cursive`; }
  NFS=fs; c.textAlign='center'; c.textBaseline='middle'; c.fillText(NAME,W/2,H*.34);
  const d=c.getImageData(0,0,W,H).data, st=Math.max(3,Math.round(W/120)); let pts=[];
  for(let y=0;y<H;y+=st) for(let x=0;x<W;x+=st) if(d[(y*W+x)*4+3]>140) pts.push([x,y]);
  if(pts.length>900) pts=pts.filter(()=>Math.random()<900/pts.length);
  const mk=(tx,ty)=>({x0:Math.random(),y0:Math.random()*.7,tx,ty,sp:.3+Math.random()*.5,ph:Math.random()*6,sz:.6+Math.random()*.8,d:Math.random()*2});
  FF=pts.map(p=>mk(p[0],p[1])); for(let i=0;i<60;i++) FF.push(mk(null,null));
}
function drawFF(t,u){
  ctx.globalCompositeOperation='lighter';
  for(const f of FF){
    const vis=clamp((t-.3-f.d*.6)/1.2); if(vis<=0) continue;
    let x=f.x0*W+Math.sin(t*f.sp+f.ph)*u*.06, y=f.y0*H+Math.cos(t*f.sp*1.3+f.ph)*u*.05;
    const tw=.6+.4*Math.sin(t*3+f.ph*3);
    if(f.tx!=null){ const p=ease(clamp((t-2.4-f.d)/2.4)); x+=(f.tx-x)*p+Math.sin(t*2+f.ph)*u*.002*p; y+=(f.ty-y)*p+Math.cos(t*2.3+f.ph)*u*.002*p; }
    const r=u*.004*f.sz;
    ctx.globalAlpha=vis*.25*tw; ctx.fillStyle='#ffd36b'; ctx.beginPath(); ctx.arc(x,y,r*3.5,0,7); ctx.fill();
    ctx.globalAlpha=vis*tw; ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
}

// ---------- Fairies ----------
const FAIRY=[['#ffe08a',.31,.5],['#ffb3d1',.23,1.7],['#b8e6ff',.27,3.1],['#d9c2ff',.19,4.4],['#c8ffd9',.35,5.6],['#ffd1a8',.29,2.4],['#ffc4ec',.21,3.9]]
  .map(([c,sp,ph],i)=>({c,sp,ph,sp2:sp*1.3+.1,ph2:ph*1.7,d:.5+i*.9}));
let dust=[], DT=.016;
function fairies(k,u){
  for(const f of FAIRY){
    const a=ease(clamp((k-f.d)/1.5)); if(a<=0) continue;
    const x=W*(.5+.42*Math.sin(k*f.sp+f.ph)), y=H*(.42+.22*Math.sin(k*f.sp2+f.ph2)), fl=Math.sin(k*25+f.ph);
    if(Math.random()<DT*22) dust.push({x,y,vx:(Math.random()-.5)*u*.03,vy:u*.02+Math.random()*u*.03,l:1,c:f.c});
    const gr=ctx.createRadialGradient(x,y,0,x,y,u*.07); gr.addColorStop(0,f.c); gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=a*.5; ctx.fillStyle=gr; ctx.fillRect(x-u*.07,y-u*.07,u*.14,u*.14);
    ctx.globalAlpha=a*.8; ctx.fillStyle='rgba(255,255,255,.9)';
    for(const d of [-1,1]){ ctx.save(); ctx.translate(x,y); ctx.rotate(d*(.7+.25*fl)); ctx.beginPath(); ctx.ellipse(0,-u*.017,u*.008,u*.02,0,0,7); ctx.fill();
      ctx.rotate(d*.9); ctx.beginPath(); ctx.ellipse(0,-u*.011,u*.006,u*.013,0,0,7); ctx.fill(); ctx.restore(); }
    ctx.globalAlpha=a; ctx.fillStyle=f.c; ctx.beginPath(); ctx.ellipse(x,y+u*.008,u*.004,u*.009,0,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y-u*.005,u*.005,0,7); ctx.fill();
  }
  for(let i=dust.length-1;i>=0;i--){
    const p=dust[i]; p.l-=DT*.7; if(p.l<=0){ dust.splice(i,1); continue; }
    p.x+=p.vx*DT; p.y+=p.vy*DT; ctx.globalAlpha=p.l*.8; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,u*.003*p.l+1,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ---------- Lotus ----------
function lotus(cx,cy,r,p,al){
  const g0=ctx.createRadialGradient(cx,cy-r*.4,0,cx,cy-r*.4,r*2); g0.addColorStop(0,'rgba(255,150,200,'+.35*p*al+')'); g0.addColorStop(1,'rgba(255,150,200,0)');
  ctx.fillStyle=g0; ctx.fillRect(cx-r*2,cy-r*2.4,r*4,r*4);
  for(const [n,len,w,op] of [[9,1,.4,1.3],[7,.85,.38,1],[5,.65,.34,.65]]) for(let j=0;j<n;j++){
    const a=(j-(n-1)/2)/((n-1)/2)*op*p, l=r*len*(.35+.65*p);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a); ctx.globalAlpha=al;
    const g=ctx.createLinearGradient(0,0,0,-l); g.addColorStop(0,'#e0559a'); g.addColorStop(1,'#ffe6f2');
    ctx.fillStyle=g; ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=r*.012;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-w*l,-l*.3,-w*l*.7,-l*.85,0,-l); ctx.bezierCurveTo(w*l*.7,-l*.85,w*l,-l*.3,0,0); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if(p>.5){ ctx.globalAlpha=al*(p-.5)*2; ctx.fillStyle='#ffd36b'; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(cx+i*r*.06,cy-r*.22-Math.abs(i)*r*.02,r*.035,0,7); ctx.fill(); } }
  ctx.globalAlpha=1;
}

// ---------- Lanterns ----------
function lanterns(t,u){
  for(const l of LAN){
    const k=t-l.d; if(k<=0) continue;
    const x=l.x*W+Math.sin(k*.7+l.ph)*u*.03, y=H*.72-k*u*l.v; if(y<-u*.1) continue;
    const a=clamp(k/1.2)*clamp((y+u*.1)/(u*.25)), w=u*.035*l.s, h=u*.05*l.s;
    const gr=ctx.createRadialGradient(x,y,0,x,y,w*3.4); gr.addColorStop(0,'rgba(255,170,60,.5)'); gr.addColorStop(1,'rgba(255,170,60,0)');
    ctx.globalAlpha=a; ctx.fillStyle=gr; ctx.fillRect(x-w*3.4,y-w*3.4,w*6.8,w*6.8);
    const bg=ctx.createLinearGradient(0,y-h/2,0,y+h/2); bg.addColorStop(0,'#ffb347'); bg.addColorStop(1,'#ff7a2f');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(x-w*.7,y-h/2); ctx.lineTo(x+w*.7,y-h/2); ctx.lineTo(x+w,y+h/2); ctx.lineTo(x-w,y+h/2); ctx.fill();
    ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(x,y+h*.3,w*.3*(1+.2*Math.sin(t*10+l.ph)),0,7); ctx.fill(); ctx.globalAlpha=1;
  }
}

// ---------- Start screen ----------
function intro(t,u,o){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#070b26'); g.addColorStop(1,'#1d1548'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H*.5, r=u*.02*(1+.2*Math.sin(t*3))+o*u*1.3;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r*5); gr.addColorStop(0,'rgba(255,230,150,'+(.9)+')'); gr.addColorStop(.25,'rgba(255,200,90,.35)'); gr.addColorStop(1,'rgba(255,200,90,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff6d0'; ctx.beginPath(); ctx.arc(cx,cy,u*.012,0,7); ctx.fill();
  if(o<1){ glow('for '+NAME,cx,H*.3,`${u*.1}px "Great Vibes",cursive`,'#ffe8b0','#ffcc66',u*.03,1-o);
    text('tap the light',cx,H*.7,`italic ${u*.045}px "Playfair Display",serif`,'#cdbfe8',(1-o)*(.5+.5*Math.sin(t*3))); }
  if(o>.6){ ctx.fillStyle=`rgba(7,11,38,${(o-.6)*2.5})`; ctx.fillRect(0,0,W,H); }
}

// ---------- Main scene (plays once, then stays) ----------
function scene(t,u){
  const hor=H*.7, fade=clamp(t/1.2);
  if(!F.pad){ F.pad=1; tone(110,14,0,'sine',.04); tone(165,14,0,'sine',.03); tone(220,14,0,'sine',.025); }
  const g=ctx.createLinearGradient(0,0,0,hor); g.addColorStop(0,'#070b26'); g.addColorStop(.6,'#1d1548'); g.addColorStop(1,'#6b2f6e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hor);
  ctx.fillStyle='#fff';
  for(const s of stars){ ctx.globalAlpha=(.35+.65*Math.abs(Math.sin(t*1.5+s.p)))*fade; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,u*.0022*s.s+.3,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  // moon
  const mp=ease(clamp((t-3)/5)), mx=W*.82, my=lerp(hor-u*.02,H*.12,mp), mr=u*.07, ma=clamp((t-2.5)/1);
  if(ma>0){ const mg=ctx.createRadialGradient(mx,my,0,mx,my,mr*4); mg.addColorStop(0,'rgba(255,240,200,.4)'); mg.addColorStop(1,'rgba(255,240,200,0)');
    ctx.globalAlpha=ma; ctx.fillStyle=mg; ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
    ctx.fillStyle='#fff4d6'; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
    ctx.fillStyle='rgba(200,180,140,.35)'; ctx.beginPath(); ctx.arc(mx-mr*.3,my-mr*.2,mr*.22,0,7); ctx.arc(mx+mr*.25,my+mr*.3,mr*.15,0,7); ctx.fill(); ctx.globalAlpha=1; }
  // hills + water
  ctx.fillStyle='#120d2e'; ctx.beginPath(); ctx.moveTo(0,hor);
  for(let x=0;x<=W;x+=W/40) ctx.lineTo(x,hor-(Math.sin(x*.006+1)*.5+Math.sin(x*.017)*.3+.9)*u*.035); ctx.lineTo(W,hor); ctx.fill();
  const wg=ctx.createLinearGradient(0,hor,0,H); wg.addColorStop(0,'#2a1a55'); wg.addColorStop(1,'#070618'); ctx.fillStyle=wg; ctx.fillRect(0,hor,W,H-hor);
  if(mp>0){ for(let i=0;i<10;i++){ const w=u*.05*(1+.4*Math.sin(t*2+i))*(1-i*.06);
    ctx.fillStyle=`rgba(255,240,200,${.3*mp*(1-i*.08)})`; ctx.fillRect(mx-w/2,hor+u*.015+i*u*.028,w,u*.004); } }
  // lotus + ripples
  const lp=ease(clamp((t-8)/4.5)), la=clamp((t-7.5)/1), lr=Math.min(u*.2,H*.11), lcy=hor+u*.005;
  if(la>0){
    if(!F.lo){ F.lo=1; chime([523,659,784,1047]); }
    ctx.save(); ctx.translate(0,2*lcy); ctx.scale(1,-1); lotus(W/2,lcy,lr,lp,la*.22); ctx.restore();
    if(lp>.9) for(let i=0;i<3;i++){ const ph=(t*.35+i/3)%1, rr=u*.1+ph*u*.35; ctx.strokeStyle=`rgba(255,200,230,${(1-ph)*.35})`; ctx.lineWidth=u*.002;
      ctx.beginPath(); ctx.ellipse(W/2,lcy+u*.01,rr,rr*.18,0,0,7); ctx.stroke(); }
    lotus(W/2,lcy,lr,lp,la);
  }
  // fireflies -> name
  if(t>4.6&&!F.nm){ F.nm=1; chime([784,988,1175,1568]); }
  drawFF(t,u);
  glow(NAME,W/2,H*.34,`${NFS}px "Great Vibes",cursive`,'#fff2c8','#ffcc66',u*.04,ease(clamp((t-6.5)/1.5)));
  glow('Happy Birthday',W/2,H*.45,`italic 600 ${u*.075}px "Playfair Display",serif`,'#ffe1ef','#ff7ab5',u*.03,ease(clamp((t-8)/1.5)));
  if(t>8.2&&!F.ml){ F.ml=1; melody(); }
  const ma2=ease(clamp((t-11)/1.5));
  if(ma2>0){ const ly=wrap(MSG,W/2,H*.53,W*.84,u*.055,`italic ${u*.04}px "Playfair Display",serif`,'#e9d3ea',ma2);
    if(FROM) text('\u2014 '+FROM,W/2,ly+u*.065,`${u*.06}px "Great Vibes",cursive`,'#ffe8b0',ma2); }
  fairies(t-6,u);
  lanterns(t,u);
  if(t<1.2){ ctx.fillStyle=`rgba(7,11,38,${1-fade})`; ctx.fillRect(0,0,W,H); }
}

// ---------- Timeline ----------
let phase='intro', start=0, last=0, openT=0, built=false;
cv.addEventListener('pointerdown',()=>{
  if(phase!=='intro') return;
  initAudio(); chime([659,880,1175]); phase='open'; openT=performance.now();
  Promise.all([document.fonts.load('64px "Great Vibes"',NAME),document.fonts.load('italic 40px "Playfair Display"')]).catch(()=>{}).then(()=>{ build(); built=true; });
});
function frame(now){
  const u=Math.min(W,H*.8); DT=Math.min(.05,(now-last)/1000); last=now; ctx.globalAlpha=1;
  if(phase==='intro'||phase==='open'){
    const o=phase==='open'?clamp((now-openT)/1200):0; intro(now/1000,u,o);
    if(o>=1&&built){ phase='play'; start=now; }
  } else scene((now-start)/1000,u);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
